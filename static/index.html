<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shopmind · 在线客服</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --line: #e8e8ec;
    --text: #1a1a1e;
    --muted: #8a8a94;
    --accent: #2f6feb;
    --accent-soft: #eaf1fe;
    --bubble-user: #2f6feb;
    --bubble-bot: #ffffff;
    --danger: #d1453b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100vh - 48px);
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { font-size: 12px; color: var(--muted); margin-left: auto; }
  header button {
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 10px;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: #d0d0d8; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  /* 竖排：工具徽章在上，气泡在下 */
  .row { display: flex; flex-direction: column; }
  .row.user { align-items: flex-end; }
  .row.bot { align-items: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .row.error .bubble {
    background: #fdf1f0;
    border: 1px solid #f3d3d0;
    color: var(--danger);
  }

  /* 工具轨迹徽章 */
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
    max-width: 78%;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #f7f7fa;
    color: var(--muted);
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 状态点用 CSS 画，不依赖 emoji 字体 */
  .badge::before {
    content: '';
    flex: 0 0 auto;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.55;
  }
  .badge.running {
    border-color: #c9d6ee;
    background: #eef3fc;
    color: #3b6fc4;
  }
  .badge.running::before {
    opacity: 1;
    animation: pulse 1s ease-in-out infinite;
  }
  .badge.ok {
    border-color: #cfe8d5;
    background: #f0f9f2;
    color: #2f7a45;
  }
  .badge.error {
    border-color: #f3d3d0;
    background: #fdf1f0;
    color: var(--danger);
    cursor: help;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
    padding-left: 2px;
  }

  .typing::after {
    content: "▍";
    color: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 8px 18px 0;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    font: inherit;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    max-height: 140px;
    min-height: 44px;
    outline: none;
    background: var(--bg);
  }
  textarea:focus { border-color: var(--accent); background: #fff; }
  #send {
    font: inherit;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    height: 44px;
    cursor: pointer;
  }
  #send:disabled { background: #b9c9e8; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot"></span>
    <h1>shopmind 在线客服</h1>
    <span class="sub" id="sid">新会话</span>
    <button id="reset">清空</button>
  </header>

  <div id="log">
    <div class="hint">售后问题可以直接说，比如「订单 SO20261029001 尺码不合适想退货」</div>
  </div>

  <footer>
    <textarea id="input" rows="1" placeholder="说说你遇到的问题…"></textarea>
    <button id="send">发送</button>
  </footer>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('reset');
const sidLabel = document.getElementById('sid');

let sessionId = null;
let busy = false;

function addRow(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  input.disabled = v;
}

// ---- 工具轨迹徽章 ----
// 每轮对话重置一次，避免同工具同参数在多轮之间互相覆盖
let badgeEls = new Map();

function argsText(args) {
  const s = JSON.stringify(args ?? {});
  return s.length > 42 ? s.slice(0, 39) + '…' : s;
}

function ensureToolbar(bubble) {
  let bar = bubble.parentElement.querySelector('.tools');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'tools';
    bubble.parentElement.insertBefore(bar, bubble);
  }
  return bar;
}

function upsertBadge(bubble, payload) {
  const key = payload.name + '|' + JSON.stringify(payload.args ?? {});
  let el = badgeEls.get(key);
  if (!el) {
    el = document.createElement('span');
    ensureToolbar(bubble).appendChild(el);
    badgeEls.set(key, el);
  }
  const call = `${payload.name}(${argsText(payload.args)})`;
  if (payload.status === 'running') {
    el.className = 'badge running';
    el.textContent = `${call} 调用中`;
    el.title = '';
  } else if (payload.status === 'ok') {
    el.className = 'badge ok';
    el.textContent = `${call} · ${payload.elapsed_ms ?? 0}ms`;
    el.title = '';
  } else {
    el.className = 'badge error';
    el.textContent = `${call} 失败`;
    el.title = payload.error || '工具调用失败';
  }
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

resetBtn.addEventListener('click', async () => {
  if (sessionId) {
    try {
      await fetch('/api/chat/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      });
    } catch (_) {}
  }
  sessionId = null;
  sidLabel.textContent = '新会话';
  log.innerHTML = '<div class="hint">已清空，重新开始吧</div>';
});

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;

  // 会话 id 由前端生成并稳定持有：如果首条请求失败拿不到 done 事件，
  // 后续消息仍会复用同一个 id，不会变成每次都是新会话。
  if (!sessionId) {
    sessionId = (crypto.randomUUID && crypto.randomUUID().replace(/-/g, ''))
      || ('sess' + Date.now() + Math.random().toString(16).slice(2));
    sidLabel.textContent = '会话 ' + sessionId.slice(0, 6);
  }

  input.value = '';
  input.style.height = 'auto';
  addRow('user', text);
  const bubble = addRow('bot', '');
  bubble.classList.add('typing');
  badgeEls = new Map();
  setBusy(true);

  let answer = '';
  let gotToken = false;

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });

    if (!res.ok) {
      let detail = 'HTTP ' + res.status;
      try {
        const body = await res.json();
        if (body.detail) {
          detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
        }
      } catch (_) {}
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 按空行切分 SSE 块
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        handleBlock(block);
      }
    }

    function handleBlock(block) {
      let event = 'message';
      let data = '';
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      if (!data) return;

      let payload;
      try { payload = JSON.parse(data); } catch (_) { return; }

      if (event === 'token') {
        gotToken = true;
        answer += payload.delta;
        bubble.textContent = answer;
        bubble.classList.add('typing');
        log.scrollTop = log.scrollHeight;
      } else if (event === 'tool') {
        upsertBadge(bubble, payload);
        log.scrollTop = log.scrollHeight;
      } else if (event === 'done') {
        answer = payload.content ?? answer;
        bubble.textContent = answer;
        // 兜底：万一 tool 帧漏接（断线重连、代理吞帧），用 done 里的轨迹补齐
        for (const t of payload.tools || []) {
          const key = t.name + '|' + JSON.stringify(t.args ?? {});
          if (!badgeEls.has(key)) {
            upsertBadge(bubble, { ...t, status: t.ok ? 'ok' : 'error' });
          }
        }
        sessionId = payload.session_id;
        sidLabel.textContent = '会话 ' + sessionId.slice(0, 6);
        if (payload.trimmed > 0) {
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = `已省略较早的 ${payload.trimmed} 条消息`;
          bubble.parentElement.appendChild(meta);
        }
      } else if (event === 'error') {
        throw new Error(payload.message || '上游出错');
      }
    }
  } catch (err) {
    bubble.classList.remove('typing');
    bubble.parentElement.className = 'row error';
    bubble.textContent = answer || ('出错了：' + err.message);
  } finally {
    bubble.classList.remove('typing');
    if (!answer && !gotToken && badgeEls.size === 0) {
      bubble.parentElement.className = 'row error';
      bubble.textContent = bubble.textContent || '没有收到回复，请重试';
    }
    setBusy(false);
    input.focus();
  }
}

input.focus();
</script>
</body>
</html>
